# Demo vhost — invented hostnames, not a real deployment.
server {
    listen 80;
    server_name storefront.example.com www.storefront.example.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name storefront.example.com www.storefront.example.com *.storefront.example.com;

    ssl_certificate     /etc/letsencrypt/live/storefront.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storefront.example.com/privkey.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }
}

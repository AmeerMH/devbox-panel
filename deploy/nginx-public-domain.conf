# devbox-panel — public HTTPS vhost.
#
# Install as /www/server/panel/vhost/nginx/panel.<your-domain>.conf, replace
# PANEL_DOMAIN, point the certificate paths at a real cert, then:
#     sudo /usr/local/bin/devbox-panel-nginx reload
#
# The panel itself only listens on 127.0.0.1:7070 — nginx is the only way in.

server {
    listen 80;
    listen [::]:80;
    server_name PANEL_DOMAIN;

    # Keep this so certbot/acme.sh can renew over HTTP.
    location /.well-known/acme-challenge/ { root /home/deploy/acme-webroot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # HTTP/2: nginx >= 1.25 wants `http2 on;` in the server block, while 1.24 and
    # older take it on the listen line (`listen 443 ssl http2;`) and treat it as a
    # property of the socket. Using the 1.25 syntax on 1.24 fails the config test
    # with `unknown directive "http2"`, so this template stays compatible with both:
    # on older nginx the socket already carries HTTP/2 from whichever vhost sets it.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name PANEL_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/PANEL_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PANEL_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Optional second lock. Uncomment and list your addresses to make the panel
    # unreachable from anywhere else even with the password.
    # allow 100.64.0.0/10;   # tailnet
    # allow 203.0.113.7;     # office
    # deny all;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:7070;

        # aaPanel turns on `proxy_cache cache_one` at the http level. Left on, it
        # caches panel responses and breaks the log streams.
        proxy_cache off;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        # $connection_upgrade comes from aaPanel's 0.websocket.conf. On a stock
        # nginx, add this at http level instead:
        #   map $http_upgrade $connection_upgrade { default upgrade; '' close; }
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Live `make deploy` output must arrive as it is produced, and the
        # websocket must not be reaped mid-build.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

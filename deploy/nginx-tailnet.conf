# devbox-panel — tailnet-only vhost (no public exposure).
# Mirrors the existing dev-tailnet.conf pattern: 443 is publicly reachable, so the
# allow/deny is what keeps this private. Uses the self-signed dev cert.

server {
    listen 443 ssl;
    http2 on;
    server_name panel.100.104.153.126.nip.io;

    allow 100.64.0.0/10;
    allow fd7a:115c:a1e0::/48;
    deny all;

    ssl_certificate     /etc/nginx-dev/dev.crt;
    ssl_certificate_key /etc/nginx-dev/dev.key;

    location / {
        proxy_pass http://127.0.0.1:7070;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

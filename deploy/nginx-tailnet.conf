# devbox-panel — tailnet-only vhost (no public exposure).
#
# Replace TAILSCALE_IP with the server's tailnet address (e.g. 100.x.y.z), so
# nip.io resolves the hostname without any DNS of your own. Port 443 is still
# publicly reachable and nip.io resolves publicly, so the allow/deny block below
# is what actually keeps this private. Uses a self-signed certificate.

server {
    # See the note in nginx-public-domain.conf about `http2 on;` vs `listen … http2;`.
    listen 443 ssl;
    server_name panel.TAILSCALE_IP.nip.io;

    allow 100.64.0.0/10;
    allow fd7a:115c:a1e0::/48;
    deny all;

    ssl_certificate     /etc/nginx-dev/dev.crt;
    ssl_certificate_key /etc/nginx-dev/dev.key;

    location / {
        proxy_pass http://127.0.0.1:7070;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

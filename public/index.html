<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>devbox-panel</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/vendor/xterm.css">
<div id="app">
  <div class="brand"><span class="dot" id="conn-dot" title="websocket"></span> devbox-panel</div>
  <header class="topbar">
    <span class="host mono" id="host-label">…</span>
    <div class="row">
      <span class="badge" id="jobs-badge">0 running</span>
      <button class="small" id="refresh-btn">Refresh</button>
      <button class="small" id="logout-btn">Sign out</button>
    </div>
  </header>
  <nav class="side" id="nav"></nav>
  <main id="view"></main>
  <div id="dock">
    <div class="resizer" id="dock-resizer"></div>
    <div class="tabs" id="dock-tabs"></div>
    <div class="panes" id="dock-panes"></div>
  </div>
</div>
<div class="toast-wrap" id="toasts"></div>
<div id="boot-error">
  <div class="boot-box">
    <h2>The panel did not finish loading</h2>
    <p>Its scripts could not be fetched — usually because the panel restarted while
       this page was opening, or the connection dropped.</p>
    <button onclick="location.reload()">Reload</button>
  </div>
</div>
<script>
  // app.js sets this once it has rendered. Deliberately inline: it has to work even
  // when no module loaded at all.
  window.__panelBooted = false
  setTimeout(function () {
    if (!window.__panelBooted) document.getElementById('boot-error').style.display = 'flex'
  }, 6000)
</script>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script type="module" src="/js/app.js"></script>
